project:
  type: website
  output-dir: _site
  post-render:
    - python scripts/normalize-sitemap.py
  render:
    - "*.qmd"
    - "chapters/*.qmd"
  resources:
    - "downloads/**"

lang: ko

filters:
  - filters/prompt.lua

website:
  title: "ChatGPT를 활용한 윤리적 논문 작성법"
  description: "생성형 AI 시대의 책임 있는 논문 쓰기"
  site-url: "https://joonion.github.io/hands-on-paper-writing/"
  repo-url: "https://github.com/joonion/hands-on-paper-writing"
  open-graph: true
  twitter-card: true
  navbar:
    background: primary
    left:
      - href: index.qmd
        text: 온라인 실습 가이드
  sidebar:
    style: docked
    search: true
    collapse-level: 2
    contents:
      - href: index.qmd
        text: 실습 안내
      - section: "제1부. 생성형 AI"
        contents:
          - href: chapters/ch01.qmd
          - href: chapters/ch02.qmd
          - href: chapters/ch03.qmd
      - section: "제2부. 논문 작성"
        contents:
          - href: chapters/ch04.qmd
          - href: chapters/ch05.qmd
          - href: chapters/ch06.qmd
          - href: chapters/ch07.qmd
          - href: chapters/ch08.qmd
      - section: "제3부. 논문 연구"
        contents:
          - href: chapters/ch09.qmd
          - href: chapters/ch10.qmd
          - href: chapters/ch11.qmd
          - href: chapters/ch12.qmd
  page-navigation: true
  page-footer:
    center: "© 2026 Joonion Bae · 별도 표시가 없는 콘텐츠는 [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)에 따라 이용할 수 있습니다. 제3자 자료는 해당 조건을 따릅니다."

format:
  html:
    theme: cosmo
    css: assets/styles.css
    canonical-url: true
    include-after-body:
      - assets/prompt-components.html
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
