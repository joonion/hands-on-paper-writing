project:
  type: website
  output-dir: _site
  post-render:
    - python scripts/normalize-sitemap.py
  render:
    - "*.qmd"
    - "chapters/*.qmd"
  resources:
    - "downloads/**"
    - "google366ba2a4d4ce3d1d.html"
    - "site.webmanifest"
    - "assets/images/social-card.png"
    - "assets/icons/apple-touch-icon.png"
    - "assets/icons/icon-192.png"
    - "assets/icons/icon-512.png"

lang: ko

filters:
  - filters/prompt.lua

website:
  title: "ChatGPT를 활용한 윤리적 논문 작성법"
  favicon: assets/icons/favicon.svg
  description: "생성형 AI 시대의 책임 있는 논문 쓰기"
  image: "https://joonion.github.io/hands-on-paper-writing/assets/images/social-card.png"
  image-alt: "파란 말풍선과 빨간 체크 표시가 있는 ChatGPT를 활용한 윤리적 논문 작성법 온라인 실습 가이드"
  site-url: "https://joonion.github.io/hands-on-paper-writing/"
  repo-url: "https://github.com/joonion/hands-on-paper-writing"
  repo-link-target: _blank
  open-graph:
    locale: ko_KR
  twitter-card:
    card-style: summary_large_image
  navbar:
    background: primary
    left:
      - href: index.qmd
        text: 온라인 실습 가이드
    tools:
      - icon: github
        href: https://github.com/joonion/hands-on-paper-writing
        text: GitHub 저장소
  sidebar:
    style: docked
    search: true
    collapse-level: 2
    contents:
      - href: index.qmd
        text: 실습 안내
      - section: "제1부. 생성형 AI"
        contents:
          - href: chapters/ch01.qmd
          - href: chapters/ch02.qmd
          - href: chapters/ch03.qmd
      - section: "제2부. 논문 작성"
        contents:
          - href: chapters/ch04.qmd
          - href: chapters/ch05.qmd
          - href: chapters/ch06.qmd
          - href: chapters/ch07.qmd
          - href: chapters/ch08.qmd
      - section: "제3부. 논문 연구"
        contents:
          - href: chapters/ch09.qmd
          - href: chapters/ch10.qmd
          - href: chapters/ch11.qmd
          - href: chapters/ch12.qmd
  page-navigation: true
  reader-mode: false
  back-to-top-navigation: true
  page-footer:
    left: "© 2026 Joonion Bae · [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)"
    center:
      - text: 사이트 소개
        href: about.qmd
      - text: 오류 신고
        href: https://github.com/joonion/hands-on-paper-writing/issues/new
    right:
      - icon: github
        href: https://github.com/joonion/hands-on-paper-writing

format:
  html:
    theme: cosmo
    css: assets/css/styles.css
    canonical-url: true
    include-in-header:
      - assets/includes/head.html
    include-after-body:
      - assets/includes/prompt-components.html
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
